services:
  mongo:
    image: mongo
    container_name: mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    expose:
      - 3000
    build:
      context: .
      dockerfile: Dockerfile

    container_name: backend
    restart: always
    environment:
      MONGO_URL: mongodb://mongo:27017/ecomerce
      PORT: 3000
    depends_on:
      - mongo

  frontend:
    image: nginx:alpine
    container_name: frontend
    restart: always
    ports:
      - '8080:80'
    volumes:
      - ./apps/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist/apps/frontend/browser:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mongo-data:
